<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketFetch — Extrator de Mídia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-8 selection:bg-cyan-500/30 selection:text-cyan-200">
    
    <main class="w-full max-w-2xl space-y-6 mt-4 sm:mt-10">
        <!-- Cabeçalho -->
        <header class="space-y-1">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-cyan-400">MarketFetch</h1>
            <p class="text-slate-400 text-sm">Cole o link do anúncio do Facebook Marketplace para extrair imagens e vídeos originais.</p>
        </header>

        <!-- Formulário de Extração -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="url" 
                    id="urlInput" 
                    placeholder="https://www.facebook.com/marketplace/item/..." 
                    autocomplete="off"
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition-colors"
                >
                <button 
                    id="fetchBtn" 
                    class="bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium px-6 py-3 rounded-xl text-sm transition-colors whitespace-nowrap"
                >
                    Extrair Mídia
                </button>
            </div>

            <!-- Barra de Status / Feedback -->
            <div id="statusBox" class="hidden text-xs px-3 py-2 rounded-lg border"></div>
        </section>

        <!-- Área de Resultados (Galeria) -->
        <section id="resultsSection" class="hidden space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h2 id="listingTitle" class="text-sm font-medium text-slate-300 truncate pr-4">Mídias encontradas</h2>
                <span id="mediaCount" class="text-xs bg-slate-800 text-cyan-400 px-2.5 py-0.5 rounded-full font-mono">0</span>
            </div>

            <!-- Grid das Mídias -->
            <div id="mediaGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </section>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
